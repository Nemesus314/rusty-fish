[package]
name = "rusty-fish-discord"
description = "Discord door of Rusty Fish. Thin: it hands messages to the household and delivers what comes out."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rusty-fish-core = { path = "../rusty-fish-core" }
rusty-fish-house = { path = "../rusty-fish-house" }
rusty-fish-room = { path = "../rusty-fish-room" }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
# Das nachgestellte Discord der Tests: ein Server für die Schnittstelle und ein
# WebSocket für die Verbindung. Dieselbe Fassung von tokio-tungstenite, die
# serenity mitbringt.
futures-util = "0.3"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.21"
wiremock = "0.6.5"
