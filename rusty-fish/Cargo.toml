[package]
name = "rusty-fish"
description = "Rusty Fish: everyone writes in their own language, an AI translates in passing."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
keyring = "4.2.0"
rpassword = "7.5.5"
rusty-fish-core = { path = "../rusty-fish-core" }
rusty-fish-discord = { path = "../rusty-fish-discord" }
rusty-fish-house = { path = "../rusty-fish-house" }
rusty-fish-matrix = { path = "../rusty-fish-matrix" }
rusty-fish-providers = { path = "../rusty-fish-providers" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
