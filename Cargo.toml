[workspace]
resolver = "3"
members = [
    "rusty-fish-core",
    "rusty-fish-room",
    "rusty-fish-house",
    "rusty-fish-openai",
    "rusty-fish-anthropic",
    "rusty-fish-providers",
    "rusty-fish-discord",
    "rusty-fish-matrix",
    "rusty-fish",
]

[workspace.package]
version = "0.4.5"
edition = "2024"
publish = false
# Entschieden von Nemesus am 24.11.2026: die AGPL 3, „Version 3 oder später".
# Die GPL 2 seiner WordPress-Plugins ginge hier nicht: 29 der fremden
# Bausteine stehen nur unter Apache 2.0 (gemessen am selben Tag), und die
# verträgt sich erst mit der dritten Fassung. Die AGPL statt der GPL, weil
# Gäste mit einem Fisch über ein Netz sprechen, den sie nicht selbst
# betreiben: wer einen veränderten Fisch betreibt, schuldet ihnen den
# Quelltext. Der Wortlaut steht in LICENSE, unverändert von gnu.org.
license = "AGPL-3.0-or-later"
authors = ["Christian Ermisch (Nemesus)"]

# Die Ablage der Matrix-Geräteschlüssel ist mit einem Kennwort verschlossen;
# daraus den Schlüssel abzuleiten kostet absichtlich viele Rechenschritte.
# Unoptimiert dauert das beim Start des Fischs etwa 15 Sekunden (gemessen am
# 22.11.2026), optimiert einen Augenblick. Deshalb sind diese Bausteine auch
# im Entwicklungsbau optimiert.
[profile.dev.package.matrix-sdk-store-encryption]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
# Dasselbe gilt für den Umschlag (`envelope`): 64 MiB und zwei Durchgänge sind
# die Arbeit, die ein Kennwort kosten soll, und unoptimiert kostet sie ein
# Vielfaches.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
