[package]
name = "rusty-fish-house"
description = "The household of a Rusty Fish: the profile, what it remembers, its fixed texts and the course of one message. Knows no Discord and no Matrix."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rusty-fish-core = { path = "../rusty-fish-core" }
rusty-fish-providers = { path = "../rusty-fish-providers" }
rusty-fish-room = { path = "../rusty-fish-room" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
