[package]
name = "rusty-fish-matrix"
description = "Matrix door of Rusty Fish. Thin: it hands messages to the household and delivers what comes out."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
# `bundled-sqlite` baut SQLite mit, damit unter Windows keine fremde Bibliothek
# nötig ist. Ende-zu-Ende-Verschlüsselung und die SQLite-Ablage sind von Haus
# aus an.
matrix-sdk = { version = "0.19.1", features = ["bundled-sqlite"] }
rusty-fish-core = { path = "../rusty-fish-core" }
rusty-fish-house = { path = "../rusty-fish-house" }
rusty-fish-room = { path = "../rusty-fish-room" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
# Der nachgestellte Server für die Tests kommt aus der Bibliothek selbst.
matrix-sdk = { version = "0.19.1", features = ["bundled-sqlite", "testing"] }
matrix-sdk-test = "0.19.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
