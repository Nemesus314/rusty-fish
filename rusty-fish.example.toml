# Rusty Fish, settings for one profile. This example stands at the Discord
# door; what a profile at the Matrix door says instead is noted at each place.
# Copy this file to rusty-fish.toml, fill it in, then: rusty-fish run
#
# Secrets do not belong here. Store them once with:
#   rusty-fish key set openai      (or xai, google, anthropic, custom)
#   rusty-fish key set discord
# For the Matrix door the fish logs in to a Matrix account of its own:
#   rusty-fish matrix login --user @name:server

# The AI service that translates: "openai" (ChatGPT), "xai" (Grok), "google"
# (Gemini), "anthropic" (Claude) or "custom" (your own model). Each service
# has its own key in the store, so switching back and forth loses nothing.
# `rusty-fish providers` lists them. Leave the line out and "openai" applies.
provider = "openai"

# The model that translates. `rusty-fish models --provider openai` lists what
# your key can use at that service.
model = "put-a-model-name-here"

# Optional: an address of your own in place of the service's. With "custom" it
# is required: the address of your model, for example a local server that
# speaks the OpenAI chat format. A key is optional there.
# base_url = "http://localhost:11434/v1"

# Who you are: your own Discord user id, or the name you give yourself in a
# person entry below (that entry then carries your id). Whoever runs the fish
# has agreed to the AI reading along; everyone else is asked once in their
# channel.
# In Discord: Settings -> Advanced -> Developer Mode, then right-click yourself -> Copy User ID.
# At the Matrix door: your Matrix user id, like "@name:server", or your name below.
host = "000000000000000000"

# Optional: a name for the AI. With a name, you and the people you invited can
# talk to it by starting a message with that name, like "Fish, what does that
# mean?". Someone who brought a fish of their own talks to their own AI.
# The name must stand at the start, followed by a space, a comma or a colon.
# Mentioning the bot with @ at the start of a message counts the same.
# Without a name the AI only translates.
# ai_name = "Fish"
#
# A list gives the AI several call names, for guests who type in another
# script. The first one is the name she appears under; all of them address her.
# ai_name = ["Fish", "Фиш"]

# What you allow per day (UTC), since it all runs on your key.
# Leave a line out and the value shown here applies.
[limits]
# Tokens for translating what people write, for everyone together. When they
# are used up, messages are still delivered, untranslated and marked, and the
# fish asks you in a direct message whether to add the same amount for today.
translation_tokens_per_day = 100000
# Questions to the AI per guest. You as the host have no limit. Questions and
# the translation of their answers never use up the tokens above.
questions_per_guest_per_day = 10

# A room is one conversation. Every seat is a channel with a language.
# What is written at one seat appears at all others in their language.
[[room]]
# Languages that pass untranslated, as a fallback when a translation misleads.
pass_through = ["English"]
# How many earlier messages the AI sees for context. Each one costs with every translation.
context_lines = 10

  # A seat names its door and its channel there.
  # Discord: right-click a channel -> Copy Channel ID.
  # Matrix: `matrix = "!..."` instead, the internal id of the room (in Element:
  # room settings -> Advanced), not its #alias. Invite the fish's account into
  # the room. All seats of one profile stand at the same door.
  [[room.seat]]
  discord = "000000000000000001"
  lang = "German"

  [[room.seat]]
  discord = "000000000000000002"
  lang = "Russian"
  # Optional: "female" or "male", for the person at this seat. Some languages
  # mark the gender of who speaks and who is spoken to ("I was tired", "did you
  # sleep?"); with this the AI picks the right forms instead of guessing. It is
  # passed to the AI as a grammar hint only. Leave it out if several people of
  # different gender share the seat.
  # gender = "female"
  # Optional: the person whose table this seat is, by the name you gave them
  # below (a bare Discord user id works too). The fish writes only at tables
  # without an owner, at your own (owner = host) and at those of people you
  # invited below; at all others it only reads along.
  # owner = "Robin"

# Optional, as often as you like: what you know about one person.
# [[person]]
# A name of your choosing, so you can see whose table is whose. It stays in
# this file and in the window; neither Discord nor the AI ever gets it.
# name = "Robin"
# The person's Discord user id (right-click the person -> Copy User ID). You
# can leave it out until you have it: the table, the language and the
# invitation work without. A name or an id is required.
# discord = "000000000000000003"
# The person's Matrix user id, for a profile at the Matrix door. A person may
# carry both; the one at the door of the profile counts.
# matrix = "@robin:example.org"
# The same grammar hint as at a seat. A person's own entry goes before the
# gender of the seat, so people keep their own forms at someone else's seat.
# gender = "male"
# The person's mother tongue: at a table this person owns, the fish translates
# into it instead of the seat's language.
# lang = "Russian"
# Languages that stay untranslated for this person, in place of the room's
# pass_through; an empty list means: translate everything.
# neutral = ["English"]
# Invite this person: your fish then also writes at their table, on your key
# and at your cost, and tells them so there once.
# invited = true
